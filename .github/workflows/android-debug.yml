name: Android Debug CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    if: github.head_ref != 'weblate'
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: "21"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: '.go-version'
          cache-dependency-path: 'restic/go.sum'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VER=$(sed -n -E 's/.*ndkVersion = "(.*)".*/\1/p' app/build.gradle.kts | tr -d ' ')
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VER"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Verify Android NDK toolchain
        run: |
          set -euo pipefail
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Build restic binary (arm64-v8a)
        env:
          RESTIC_ABIS: arm64-v8a
        run: |
          set -euo pipefail
          ./scripts/build_restic.sh

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build arm64-v8a debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug -PenabledAbis=arm64-v8a

      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v7
        with:
          name: restoid-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # APKs are already ZIP archives; re-compressing wastes CPU for ~0 gain.
          compression-level: 0
