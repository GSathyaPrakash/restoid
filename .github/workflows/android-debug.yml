name: Android Debug CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    if: github.head_ref != 'weblate'
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: "21"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: '.go-version'
          cache-dependency-path: 'restic/go.sum'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VER=$(sed -n -E 's/.*ndkVersion = "(.*)".*/\1/p' app/build.gradle.kts | tr -d ' ')
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VER"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Verify Android NDK toolchain
        run: |
          set -euo pipefail
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Build restic binary (arm64-v8a)
        env:
          RESTIC_ABIS: arm64-v8a
        run: |
          set -euo pipefail
          ./scripts/build_restic.sh

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build arm64-v8a debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug -PenabledAbis=arm64-v8a

      - name: Stage APK with a clear filename
        run: |
          set -euo pipefail
          mkdir -p release-out
          cp app/build/outputs/apk/debug/app-debug.apk release-out/restoid-arm64-debug.apk

      # Release assets are real files (no zip wrapper), so this is a raw .apk
      # you can download and install directly. The fixed `debug` tag is
      # overwritten on every push, so the link always points to the latest build.
      - name: Publish raw APK to rolling debug release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: debug
          name: Debug build (arm64-v8a)
          body: |
            Continuous arm64-v8a debug build, rebuilt on every push to `master`.

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          prerelease: true
          make_latest: "false"
          files: release-out/restoid-arm64-debug.apk
